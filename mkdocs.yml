site_name: manuals
site_description: Documentation-site starter template — MkDocs + Material
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

strict: true
