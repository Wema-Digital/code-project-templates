[project]
name = "python-app-template"
version = "0.1.0"
description = "General-purpose Python application skeleton — structure without committing to a web framework"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
app = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
